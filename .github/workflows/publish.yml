name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and check both packages without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'software-mansion/typegpu-kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Publish packages
        env:
          DRY_RUN: ${{ inputs['dry-run'] }}
        run: |
          args=(--no-git-checks --provenance)
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run --force)
          fi
          for package in typegpu-kit typegpu-create-kit; do
            pnpm --filter "./packages/$package" --recursive publish "${args[@]}"
          done
